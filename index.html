<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap">
<style>
:root{--bg1:#161b38;--bg2:#0b0e1d;--ink:#eef1ff;--dim:#a8b0d0;--faint:#8a92b6;--line:rgba(255,255,255,.09);--cold:#7fd0ff;--warm:#ffc86b;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg2)}
body{margin:0;color:var(--ink);font:16px/1.45 Sora,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 45%,var(--bg1) 0%,var(--bg2) 62%) fixed var(--bg2);overflow-x:clip;-webkit-text-size-adjust:100%}
.app{min-height:100vh;min-height:100dvh;max-width:2000px;margin:0 auto;display:grid;
 grid-template-columns:minmax(0,clamp(300px,26vw,400px)) minmax(0,1fr) minmax(0,clamp(240px,20vw,320px));
 grid-template-rows:auto auto auto 1fr auto;
 grid-template-areas:"alert alert alert" "head dial week" "ins dial week" "mets dial week" "foot dial week";
 column-gap:clamp(20px,2.4vw,40px);row-gap:16px;
 padding:max(24px,env(safe-area-inset-top)) max(clamp(16px,3vw,48px),env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(clamp(16px,3vw,48px),env(safe-area-inset-left))}
.alerts{grid-area:alert;display:flex;flex-direction:column;gap:8px}
.alerts:empty{display:none}
.head{grid-area:head}
h1{margin:0;font-size:clamp(26px,2.3vw,36px);font-weight:600;line-height:1.1}
.date{margin:6px 0 0;color:var(--dim);font-size:16px}
.date b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.ins{grid-area:ins;display:flex;flex-direction:column;gap:10px}
.cond{margin:0;font-size:16px;color:var(--dim)}
.story{margin:0;font-size:clamp(20px,1.75vw,27px);font-weight:300;line-height:1.3;text-wrap:pretty}
.story b{font-weight:600}.story .c{color:var(--cold)}.story .w{color:var(--warm)}
.note{margin:0;font-size:14.5px;color:var(--dim);line-height:1.5}
.mets{grid-area:mets;align-self:end}
.m{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.m span:first-child{color:var(--dim)}.m span:last-child{text-align:right}
.foot{grid-area:foot;display:flex;flex-direction:column;gap:10px}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:#8a93a8;flex:none}
.dot.ok{background:#5be3a1}.dot.warn{background:#ffc657}.dot.bad{background:#ff6b6b}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:999px;min-height:44px;padding:8px 16px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.13)}.btn:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.btn[aria-pressed=true]{background:rgba(91,227,161,.16);border-color:rgba(91,227,161,.5)}
.src{margin:0;font-size:12px;color:var(--faint);line-height:1.5}
.src a{color:var(--dim)}
.dial{grid-area:dial;align-self:center;justify-self:center;width:min(100%,calc(100vh - 56px),960px);margin:0}
@supports (height:100dvh){.dial{width:min(100%,calc(100dvh - 56px),960px)}}
.dial svg{display:block;width:100%;height:auto;font-family:Sora,system-ui,sans-serif}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:6px;font-size:12.5px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.week{grid-area:week;align-self:center}
.week h2{margin:0;font-size:18px;font-weight:600}
.week .sub{margin:4px 0 10px;font-size:12.5px;color:var(--dim)}
.day{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-top:1px solid var(--line)}
.day .r1,.day .r3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day .r1{font-size:16px;font-weight:600}.day .r1 span:last-child{white-space:nowrap}
.day .r3{font-size:12.5px;color:var(--dim)}.day .r3 span:last-child{white-space:nowrap}
.day .hol{color:var(--warm)}
.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
.bar i{position:absolute;top:0;height:6px;border-radius:3px}
.alert{border-radius:16px;padding:10px 16px;background:rgba(255,198,87,.14);border:1px solid rgba(255,198,87,.45)}
.alert.sev-Severe,.alert.sev-Extreme{background:rgba(255,90,90,.16);border-color:rgba(255,107,107,.55)}
.alert.info{background:rgba(124,200,255,.14);border-color:rgba(124,200,255,.45)}
.alert summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-height:28px}
.alert summary span{color:var(--dim);font-size:14px}
.alert p{margin:8px 0 0;font-size:14px;color:var(--dim);white-space:pre-line}
@media (min-width:900px) and (max-height:820px){.app{row-gap:12px;padding-top:18px;padding-bottom:16px}.story{font-size:clamp(19px,1.6vw,24px)}.m{padding:6px 0;font-size:14px}.note{font-size:13.5px}.day{padding:8px 0;gap:5px}.btn{min-height:40px;padding:6px 14px}}
@media (max-width:899px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"alert" "head" "dial" "ins" "mets" "week" "foot";row-gap:20px}
 .dial{width:min(100%,560px)}
 .mets,.week{align-self:auto}
 .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
 <section class="alerts" id="alerts" aria-live="polite"></section>
 <header class="head"><h1>Hutto, Texas</h1><p class="date"><span id="date">—</span> · <b id="clock">—</b></p></header>
 <figure class="dial" id="dial">
  <svg id="dialSvg" viewBox="-34 -34 828 828" role="img" aria-label="Reloj de 24 horas con la temperatura de cada hora"></svg>
  <figcaption class="legend">
   <span>Cada barra es una hora: más lejos del centro, más calor</span>
   <span><svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="#7fd0ff" stroke-dasharray="3 4"/></svg>32°F · 0°C</span>
   <span><svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="#ffc86b" stroke-width="5" stroke-linecap="round"/></svg>horas de sol</span>
  </figcaption>
 </figure>
 <section class="ins">
  <p class="cond" id="cond">—</p>
  <p class="story" id="story">Cargando el pronóstico del NWS…</p>
  <p class="note" id="note"></p>
 </section>

 <section class="week" aria-labelledby="wkT"><h2 id="wkT">Próximos días</h2><p class="sub">Máxima del día y mínima de la noche</p><div id="week"></div></section>
 <footer class="foot">

  <div class="btns"><button class="btn" id="bFull" type="button" hidden>Pantalla completa</button><button class="btn" id="bLock" type="button" aria-pressed="false" hidden>Mantener pantalla encendida</button></div>
  <p class="src" id="src">Fuente: Servicio Meteorológico Nacional de EE. UU. (NWS).</p>

 if(tips.length===24){let d=`M${f(tips[0][0])},${f(tips[0][1])}`;for(let i=0;i<24;i++){const a=tips[(i+23)%24],b=tips[i],c=tips[(i+1)%24],e=tips[(i+2)%24];d+=`C${f(b[0]+(c[0]-a[0])/6)},${f(b[1]+(c[1]-a[1])/6)} ${f(c[0]-(e[0]-b[0])/6)},${f(c[1]-(e[1]-b[1])/6)} ${f(c[0])},${f(c[1])}`}g.push(`<path d="${d}Z" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.4"/>`)}
 const now=decH(new Date()),[hx0,hy0]=pos(134,now),[hx1,hy1]=pos(340,now);
 g.push(`<line x1="${f(hx0)}" y1="${f(hy0)}" x2="${f(hx1)}" y2="${f(hy1)}" stroke="#fff" stroke-width="2"/><circle cx="${f(hx1)}" cy="${f(hy1)}" r="5" fill="#fff"/>`);
 const step=small?6:3,cand=[];for(let i=0;i<P.length;i+=step)cand.push(i);
 const keep=new Set(cand.filter(i=>Math.abs(i-iMn)>=2&&Math.abs(i-iMx)>=2));keep.add(iMn);keep.add(iMx);
 for(const i of keep){const p=P[i],h=decH(new Date(p.startTime))+.5,[x,y]=pos(R(p.temperature)+Number(u(small?20:22)),h),col=i===iMn?'#7fd0ff':i===iMx?'#ffc86b':'#eef1ff',tag=i===iMn?'mín ':i===iMx?'máx ':'';
  g.push(`<text x="${f(x)}" y="${f(y-Number(u(1)))}" text-anchor="middle" font-size="${u(14)}" font-weight="600" fill="${col}" stroke="${BG}" stroke-width="${u(4)}" paint-order="stroke">${tag}${esc(p.temperature)}°F</text><text x="${f(x)}" y="${f(y+Number(u(13)))}" text-anchor="middle" font-size="${u(11.5)}" fill="#a8b0d0" stroke="${BG}" stroke-width="${u(4)}" paint-order="stroke">${toC(p.temperature)}°C</text>`)}
 const o=S.obs,h0=P[0],tC=o&&o.t!=null?o.t:(h0.temperature-32)*5/9;
 g.push(`<circle cx="380" cy="380" r="132" fill="#10142a" stroke="#fff" stroke-opacity=".12"/>`);
 g.push(`<text x="380" y="${380-70}" text-anchor="middle" font-size="${Math.max(13,Number(u(12)))}" fill="#a8b0d0">Ahora</text>`);
 g.push(`<text x="380" y="374" text-anchor="middle" font-size="60" font-weight="300" fill="#eef1ff">${toF(tC)}°F</text><line x1="324" y1="392" x2="436" y2="392" stroke="#fff" stroke-opacity=".2"/><text x="380" y="450" text-anchor="middle" font-size="60" font-weight="300" fill="#eef1ff">${Math.round(tC)||0}°C</text>`);
 svg.innerHTML=g.join('')}
new ResizeObserver(()=>{try{drawDial()}catch(e){}}).observe($('#dial'));

/* textos y paneles */
function renderInfo(){
 const o=S.obs,P=next24(),h0=P[0];
 const feels=o?(o.wc??o.hi??o.t):null,txt=trWx((o&&o.txt)||(h0&&h0.shortForecast));
 $('#cond').textContent=[txt,feels!=null?`sensación ${bothC(feels)}`:''].filter(Boolean).join(' · ')||'—';
 if(P.length){const ts=P.map(p=>p.temperature),mn=Math.min(...ts),mx=Math.max(...ts),iMn=ts.indexOf(mn),iMx=ts.indexOf(mx),at=i=>'a las '+fHour.format(new Date(P[i].startTime));
  const C=`<b class="c">${mn}°F (${toC(mn)}°C)</b>`,W=`<b class="w">${mx}°F (${toC(mx)}°C)</b>`;let s;
  if(iMn<=iMx)s=iMn===0?`Ahora estamos en lo más frío de las próximas 24 horas: ${C}. Después sube hasta ${W} ${at(iMx)}.`:`Lo más frío llega ${at(iMn)}: ${C}. Después sube hasta ${W} ${at(iMx)}.`;
  else s=iMx===0?`Ahora estamos en lo más cálido de las próximas 24 horas: ${W}. Después baja hasta ${C} ${at(iMn)}.`:`Lo más cálido llega ${at(iMx)}: ${W}. Después baja hasta ${C} ${at(iMn)}.`;
  $('#story').innerHTML=dot(s);
  const notes=[],A=(S.al||[]).filter(a=>!a.ends||new Date(a.ends)>Date.now());
  if(mn<=32)notes.push(`Bajará a ${mn}°F (${toC(mn)}°C), por debajo del punto de congelación.`);
  else if(mn<=35)notes.push(`La mínima queda a solo ${mn-32}°F del punto de congelación (32°F · 0°C).`);
  const mp=Math.max(...P.map(p=>p.pop||0));if(mp>=20){const ip=P.findIndex(p=>p.pop===mp);notes.push(`Lluvia: hasta ${mp} % ${at(ip)}.`)}
  notes.push(A.length?`El NWS tiene ${A.length===1?'una alerta activa':A.length+' alertas activas'} para Hutto (arriba).`:'Sin alertas activas del NWS para Hutto.');
  $('#note').textContent=dot(notes.join(' '))}
 const rh=o&&o.rh!=null?o.rh:h0&&h0.rh,st=sunTimes(Date.now()),mo=moon(),M=[];
 M.push(['Humedad',rh!=null?Math.round(rh)+' %':'—']);
 if(o&&o.ws!=null){const mph=Math.round(o.ws/1.609344);M.push(['Viento',mph===0?'Calma':`${dirEs(o.wd)} ${mph} mph · ${Math.round(o.ws)} km/h${o.wg?` · rachas ${Math.round(o.wg/1.609344)} mph`:''}`])}else M.push(['Viento','—']);
 M.push(['Punto de rocío',o&&o.dp!=null?bothC(o.dp):'—']);
 M.push(['Presión',o&&o.p?`${(o.p*.0002953).toFixed(2)} inHg · ${Math.round(o.p/100)} hPa`:'—']);
 M.push(['Visibilidad',o&&o.vis!=null?`${Math.round(o.vis/1609.344)} mi · ${Math.round(o.vis/1000)} km`:'—']);
 M.push(['Sol',`${clock(st.rise)} – ${clock(st.set)}`]);
 M.push(['Luna',`${mo.n} · ${mo.ill} %`]);
 $('#mets').innerHTML=M.map(([k,v])=>`<div class="m"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}
function buildCols(){const ps=(S.fc||[]).filter(p=>new Date(p.endTime)>Date.now());if(!ps.length)return[];const m=new Map(),tk=keyOf(new Date());
 for(const p of ps){const s=new Date(p.startTime),d=!p.isDaytime&&decH(s)<6?new Date(+s-12*36e5):s,k=keyOf(d);if(!m.has(k))m.set(k,{key:k,date:d,day:null,night:null});const o=m.get(k);if(p.isDaytime)o.day=p;else o.night=p}
 return[...m.values()].sort((a,b)=>a.key<b.key?-1:1).map(d=>{const ref=d.day||d.night;return{date:d.date,day:d.day,night:d.night,hi:d.day?d.day.temperature:null,lo:d.night?d.night.temperature:null,holi:HOLI[ref.name.replace(/ Night$/,'')]||'',cond:trWx(ref.shortForecast),label:d.key===tk?(d.day?'Hoy':'Esta noche'):d.key<tk?'Madrugada':`${wkShort(d.date)} ${fDay.format(d.date)}`}})}
function renderWeek(){const cols=buildCols().slice(0,8),T=cols.flatMap(c=>[c.hi,c.lo]).filter(v=>v!=null);if(!T.length){$('#week').textContent='—';return}
 const a=Math.min(...T)-4,b=Math.max(...T)+4,pc=t=>((t-a)/(b-a)*100).toFixed(1);
 $('#week').innerHTML=cols.map(c=>{const only=c.hi==null||c.lo==null,t=c.hi??c.lo;
  const bar=only?`<i style="left:calc(${pc(t)}% - 3px);width:6px;background:${rgb(tcol(t))}"></i>`:`<i style="left:${pc(c.lo)}%;width:${(+pc(c.hi)-+pc(c.lo)).toFixed(1)}%;background:linear-gradient(90deg,${rgb(tcol(c.lo))},${rgb(tcol(c.hi))})"></i>`;
  const right=c.hi!=null?both(c.hi):'mín '+both(c.lo),low=c.hi!=null&&c.lo!=null?both(c.lo):c.hi!=null?'mínima aún sin pronóstico':'';
  return`<div class="day"><div class="r1"><span>${esc(c.label)}</span><span>${right}</span></div><div class="bar">${bar}</div><div class="r3"><span class="${c.holi?'hol':''}">${esc(c.holi||c.cond)}</span><span>${low}</span></div></div>`}).join('')}
function renderAlerts(){const A=(S.al||[]).filter(a=>!a.ends||new Date(a.ends)>Date.now()),blocked=!live&&['obs','fc','hr'].every(k=>S.fail[k]>0),last=Math.max(S.t.obs||0,S.t.fc||0,S.t.hr||0);
 let h=A.map(a=>`<details class="alert sev-${esc(a.severity)}"><summary><b>${esc(ALERT[a.event]||a.event)}</b><span>${a.ends?'hasta el '+esc(fWhen.format(new Date(a.ends))):''} · toca para ver el texto oficial del NWS (en inglés)</span></summary><p>${esc(a.headline)}</p><p>${esc(a.desc)}</p>${a.instr?`<p>${esc(a.instr)}</p>`:''}</details>`).join('');
 if(blocked)h=`<div class="alert info"><b>No se pudo conectar con el NWS.</b> Revisa la conexión a internet; el panel lo reintenta solo.${last?` Mientras tanto ves los datos guardados (${esc(fWhen.format(new Date(last)))}).`:''}</div>`+h;
 $('#alerts').innerHTML=h}
function ago(ms){const m=Math.round(ms/6e4);return m<1?'hace un momento':m<60?`hace ${m} min`:`hace ${Math.floor(m/60)} h${m%60?' '+m%60+' min':''}`}
function renderStatus(){const last=Math.max(S.t.obs||0,S.t.fc||0,S.t.hr||0),age=Date.now()-last,failing=['obs','fc','hr'].some(k=>S.fail[k]>0);let cls='ok',txt;
 if(!live&&failing){cls='bad';txt=last?`Sin conexión · datos de ${ago(age)}`:'Sin conexión con el NWS; reintentando…'}
 else if(!last||!live&&!failing){cls='';txt='Conectando con el NWS…'}
 else if(failing&&age>15*6e4){cls='bad';txt=`Sin conexión · últimos datos de ${ago(age)}`}
 else{txt=`En vivo · actualizado ${ago(age)}`;if(failing)cls='warn'}
 $('#dot').className='dot '+cls;$('#status').textContent=txt;renderAlerts()}
function renderSrc(){const o=S.obs;$('#src').innerHTML=dot(`Fuente: Servicio Meteorológico Nacional de EE. UU. (NWS), oficina de Austin/San Antonio, vía <a href="https://forecast.weather.gov/MapClick.php?lat=30.55&amp;lon=-97.53">api.weather.gov</a>.${o?` Observado a las ${esc(clock(o.ts))} en ${esc(o.name)} (${esc(S.station)}).`:''}${S.fcAt?` Pronóstico actualizado a las ${esc(clock(S.fcAt))}.`:''}`)}
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k)),hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),css=c=>`rgb(${c.join(',')})`;
function updateSky(){const alt=sunAlt(Date.now()),day=clamp01((alt+6)/14),tw=clamp01(1-Math.abs(alt+1)/9);
 let b1=mix(hx('#161b38'),hx('#1f3c76'),day),b2=mix(hx('#0b0e1d'),hx('#0d1b42'),day);b1=mix(b1,hx('#4a3a6e'),tw*.5);
 const r=document.documentElement.style;r.setProperty('--bg1',css(b1));r.setProperty('--bg2',css(b2));const tm=document.querySelector('meta[name=theme-color]');if(tm)tm.content=css(b2)}
function renderAll(){for(const f of[renderInfo,drawDial,renderWeek,renderSrc,updateSky,renderStatus])try{f()}catch(e){console.error(e)}}
function renderClock(){const d=new Date();$('#clock').textContent=fClock.format(d);$('#date').textContent=cap(fLong.format(d))}

/* pantalla completa y pantalla encendida */
const bFull=$('#bFull'),bLock=$('#bLock'),de=document.documentElement;
if(de.requestFullscreen){bFull.hidden=false;bFull.addEventListener('click',()=>{try{document.fullscreenElement?document.exitFullscreen():de.requestFullscreen()}catch(e){}});document.addEventListener('fullscreenchange',()=>{bFull.textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa'})}
let wl=null,wantLock=false;try{wantLock=localStorage.getItem('clima-hutto-lock')==='1'}catch(e){}
function lockUI(){bLock.setAttribute('aria-pressed',wl?'true':'false');bLock.textContent=wl?'Pantalla encendida: sí':'Mantener pantalla encendida'}
async function lock(on){try{if(on){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;lockUI()})}else{const w=wl;wl=null;if(w)await w.release()}}catch(e){wl=null}lockUI()}
if('wakeLock'in navigator){bLock.hidden=false;bLock.addEventListener('click',()=>{wantLock=!wl;try{localStorage.setItem('clima-hutto-lock',wantLock?'1':'0')}catch(e){}lock(wantLock)});if(wantLock)lock(true)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(wantLock&&!wl&&'wakeLock'in navigator)lock(true);renderAll();tick()}});

renderClock();setInterval(renderClock,1000);
renderAll();tick();setInterval(tick,3e4);setInterval(()=>{renderStatus();try{drawDial();renderInfo();updateSky()}catch(e){}},6e4);
}
</script>
